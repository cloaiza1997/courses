<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <section class="racha">
      <span class="racha-numero" id="racha-numero">0</span>
      <span class="racha-texto">días de racha 🔥</span>
      <p class="mejor-racha">Récord: <span id="mejor-racha-numero">0</span> días</p>
    </section>

    <section class="formulario">
      <h2>Registrar sesión</h2>
      <form id="form-sesion">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" placeholder="¿Qué estudiaste?" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" min="1" placeholder="Ej: 45" required>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="sesiones">
      <h2>Sesiones</h2>
      <ul id="lista-sesiones"></ul>
      <p id="sin-sesiones" class="vacío">Aún no hay sesiones registradas.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
