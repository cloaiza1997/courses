<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <section class="hero">
      <p class="hero-etiqueta">Racha actual</p>
      <p class="hero-numero"><span id="racha-numero">0</span> <span class="hero-fuego">🔥</span></p>
      <div class="hero-stats">
        <div class="stat">
          <span class="stat-valor" id="mejor-racha-numero">0</span>
          <span class="stat-etiqueta">Récord</span>
        </div>
        <div class="stat">
          <span class="stat-valor" id="minutos-semana">0 min</span>
          <span class="stat-etiqueta">Semana</span>
        </div>
        <div class="stat">
          <span class="stat-valor" id="dias-mes">0</span>
          <span class="stat-etiqueta">Mes</span>
        </div>
      </div>
    </section>

    <section class="mapa-calor">
      <h2>Últimas 4 semanas</h2>
      <div class="mapa" id="mapa-calor"></div>
      <div class="leyenda">
        <span>Menos</span>
        <div class="leyenda-celda" style="background: #E8DFD3"></div>
        <div class="leyenda-celda" style="background: #C6D9C6"></div>
        <div class="leyenda-celda" style="background: #8BA888"></div>
        <div class="leyenda-celda" style="background: #5C8A5C"></div>
        <div class="leyenda-celda" style="background: #2D5A2D"></div>
        <span>Más</span>
      </div>
    </section>

    <section class="formulario">
      <h2>Registrar sesión</h2>
      <form id="form-sesion">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" placeholder="¿Qué estudiaste?" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" min="1" placeholder="Ej: 45" required>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="sesiones">
      <h2>Sesiones</h2>
      <ul id="lista-sesiones"></ul>
      <p id="sin-sesiones" class="vacío">Aún no hay sesiones registradas.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
